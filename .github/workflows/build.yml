name: build
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: APK
        run: ./gradlew --no-daemon assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: drakar-${{ github.run_number }}
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
      # main: the APK is also published as the rolling "latest" release (direct download from the phone)
      - name: Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk drakar.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest drakar.apk --prerelease --target "$GITHUB_SHA" \
            --title "drakar · build ${{ github.run_number }}" --notes "Commit ${GITHUB_SHA::7}. Install drakar.apk on the phone, then set it as the live wallpaper."
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: reports
          path: app/build/reports
