name: build
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # the runner image ships the Android SDK (ANDROID_HOME); missing platforms are fetched by the build
      - name: Unit tests and APK
        run: |
          set -o pipefail
          ./gradlew --no-daemon testDebugUnitTest assembleRelease 2>&1 | tee build.log
      # build errors as one annotation (readable from the run summary and the API)
      - name: Report errors
        if: failure()
        run: |
          msg=$(grep -E "^e: |^w: .*deprecat|error:|What went wrong|FAILED|Exception|expected:|^   > " build.log | grep -v "^> Task"  | head -60 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
          echo "::error title=build::${msg}"
      # main: the APK is published as the rolling "latest" release (direct download from the phone)
      - name: Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk drakar.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest drakar.apk --prerelease --target "$GITHUB_SHA" \
            --title "drakar · build ${{ github.run_number }}" --notes "Commit ${GITHUB_SHA::7}. Install drakar.apk on the phone, then set it as the live wallpaper."
      - uses: actions/upload-artifact@v4
        with:
          name: drakar-${{ github.run_number }}
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
